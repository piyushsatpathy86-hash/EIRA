name: EIRA CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn groq pydantic pydantic-settings pytest

    - name: Check Python syntax
      run: |
        python -m py_compile core/router.py
        python -m py_compile tools/memory_tool.py
        python -m py_compile tools/session_tool.py
        python -m py_compile tools/file_tool.py
        python -m py_compile api/main.py
        echo "All syntax checks passed"

    - name: Run tests
      run: |
        cd $GITHUB_WORKSPACE
        python -m pytest tests/ -v